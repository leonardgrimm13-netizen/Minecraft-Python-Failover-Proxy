# Complete configuration for Minecraft Python Failover Proxy.
# Copy this file to config.toml, edit MAIN/FALLBACK, then run:
#   mc-failover --config config.toml --check-config

[config]
# Reject unknown sections and keys. Keep this enabled so spelling mistakes fail fast.
strict_unknown_keys = true

[proxy]
# Public Minecraft listener. Use "::" for an IPv6 wildcard listener.
listen_host = "0.0.0.0"
listen_port = 25565
# Kernel accept queue, before application-level connection limits are applied.
backlog = 256

[main]
# A target sharing a listener port is DNS-resolved and checked fail-closed against
# every actually bound local address before healthchecks or player routing.
# DNS wildcard answers are rejected; irrelevant IPv6 zones cannot hide listener aliases.
host = "127.0.0.1"
port = 25564

[fallback]
host = "127.0.0.1"
port = 25566

[healthcheck]
# MAIN check. "tcp" proves that a TCP connection can be opened.
# "minecraft_status" additionally validates a Minecraft status response.
enabled = true
mode = "tcp"
interval_seconds = 3.0
# One absolute deadline covers DNS/connect/write/read for each check.
timeout_seconds = 2.0
fail_after = 2
recover_after = 2
min_recovery_seconds = 0.0
# Empty target_host and an omitted target_port use [main].
target_host = ""
# target_port = 25564
protocol_version = 767
# Empty status_hostname uses the effective healthcheck host.
status_hostname = ""
require_valid_json = true
# Paper may report protocol = -1 while startup is incomplete. Keep this true
# so such a structurally valid response is not considered ready.
reject_uninitialized_protocol = true
log_status_details = false
jitter_seconds = 0.0
# Zero/empty filters disable the corresponding minecraft_status constraint.
max_latency_ms = 0.0
expected_version_contains = ""
motd_must_contain = ""
motd_must_not_contain = ""
min_players_max = 0

[fallback_healthcheck]
# FALLBACK is monitored independently with its own counters and hysteresis.
# When disabled, FALLBACK remains optimistically routable but health is unknown;
# monitoring therefore reports a degraded state whenever it is selected.
enabled = true
mode = "tcp"
interval_seconds = 3.0
timeout_seconds = 2.0
fail_after = 2
recover_after = 2
min_recovery_seconds = 0.0
target_host = ""
# target_port = 25566
protocol_version = 767
status_hostname = ""
require_valid_json = true
reject_uninitialized_protocol = true
log_status_details = false
jitter_seconds = 0.0
max_latency_ms = 0.0
expected_version_contains = ""
motd_must_contain = ""
motd_must_not_contain = ""
min_players_max = 0

[connection]
# Upstream connection deadline and bounded relay buffer.
timeout_seconds = 5.0
buffer_size = 65536
# Zero disables the established-session idle timeout.
idle_timeout_seconds = 300.0
write_timeout_seconds = 30.0
# After one clean TCP half-close, allow the opposite direction to finish for this long.
relay_drain_timeout_seconds = 10.0
# SIGTERM/SIGINT: drain sessions, then cancel them, then bound writer cleanup.
shutdown_grace_seconds = 30.0
shutdown_cancel_timeout_seconds = 5.0
# If true, an actual failed MAIN connect may immediately try healthy FALLBACK in auto mode.
connect_fallback_on_main_connect_failure = false
tcp_keepalive = false
# Global Minecraft handlers, including queued accepts and sessions still cleaning up.
max_connections = 4096
# Zero disables the per-source-IP limit. Must not exceed max_connections.
max_connections_per_ip = 0
# Lightweight token bucket for new connections; both values must be zero or both positive.
new_connections_per_second = 0.0
new_connections_burst = 0

[maintenance]
# auto, force_main, force_fallback, or force_target.
mode = "auto"
# Required only for force_target; must name an enabled configured backend.
# force_target = "MAIN"
# Relative paths are resolved against the directory containing this TOML file.
# Empty values disable file overrides. force_fallback_file wins if both files exist.
# Access/I/O errors retain the last known mode and log a warning.
force_fallback_file = ""
force_main_file = ""
file_check_interval_seconds = 1.0

[circuit_breaker]
# MAIN circuit: failed real connects plus typed established-backend I/O evidence.
# Successful TCP acceptance does not erase the separate session-failure history.
enabled = true
failure_threshold = 3
failure_window_seconds = 10.0
open_seconds = 15.0
half_open_max_attempts = 1

[routing]
# Distinct backend attempts before any session is bound; forced modes never retry elsewhere.
# Multi-backend mode tries the next routable entry; legacy mode retains the connection flag above.
max_connect_attempts = 16
# Total budget for selecting/connecting all candidates, including outbound PROXY setup.
connect_budget_seconds = 10.0
# Independent backend tasks share this cap on checks doing network I/O.
max_parallel_healthchecks = 16

[passive_health]
# Proven backend reset/read/write errors feed this bounded sliding window.
# Normal EOF, client disconnect, idle timeout, shutdown and cancellation do not count.
enabled = true
failure_threshold = 3
failure_window_seconds = 30.0
quarantine_seconds = 10.0
# Zero disables ambiguous early-session verification. A positive value requests
# a coalesced active check after an early backend EOF; EOF alone never quarantines.
early_session_seconds = 0.0

[status]
# Disabled preserves completely transparent legacy forwarding.
enabled = false
# With enabled=true, always=true answers status locally even with a usable backend.
always = false
# Answer status locally during forced maintenance; login still follows routing policy.
maintenance = true
# One deadline for bounded handshake classification, then a complete local status exchange.
handshake_timeout_seconds = 2.0
session_timeout_seconds = 5.0
max_handshake_bytes = 2048
# Independent cap; global/source/rate limits still apply to every accepted connection.
max_concurrent = 64
# Plain text components; Minecraft section-sign formatting and newlines are supported.
motd_online = "Minecraft network online"
motd_maintenance = "Minecraft network under maintenance"
motd_fallback = "Main server offline; fallback available"
motd_offline = "Server temporarily offline\nPlease try again later."
version_name = "Failover Proxy"
# -1 advertises an unspecified/incompatible protocol rather than claiming a real server version.
protocol_version = -1
# Omit both when reliable counts are unavailable. Set only truthful administrator-supplied counts.
# players_online = 0
# players_max = 100
# Optional inline data:image/png;base64,...; valid bounded 64x64 PNG only (no file or URL reads).
# favicon = "data:image/png;base64,..."
# Append a bounded public operating-state hint, without internal backend addresses.
dynamic_hint = false

[reload]
# Linux SIGHUP reloads supported changes atomically; disabled ignores reload requests.
enabled = true
# Backend/priority/health/maintenance/circuit/passive/status changes are supported.
# Proxy listener, admission/rate limits, PROXY trust/framing and monitoring bind/cap require restart.
# Logging, transport deadlines and monitoring authentication/timeouts can reload.

[proxy_protocol]
# Inbound PROXY v1/v2 is disabled by default. When accept=true, fail-closed
# validation requires at least one trusted IPv4/IPv6/CIDR peer below.
accept = false
# Outbound header; enable only when the selected backend expects it.
send = false
version = 1
# Optional direction-specific overrides (1 or 2):
# accept_version = 2
# send_version = 2

# DANGEROUS: true lets every direct peer assert an arbitrary source address.
# Never use it on an Internet-facing listener. It cannot be combined with trusted_proxy_ips.
trust_all_proxies = false
trusted_proxy_ips = []
# Absolute inbound header deadline and total header/TLV size bound.
header_timeout_seconds = 2.0
max_header_bytes = 4096

[monitoring]
# Enabled only on container/host loopback so Docker can probe the running event loop.
# Set enabled=false if monitoring and the image HEALTHCHECK are both intentionally unused.
enabled = true
listen_host = "127.0.0.1"
listen_port = 8080
# A non-loopback bind requires allow_remote=true and either bearer_token or the
# explicit dangerous allow_unauthenticated_remote=true opt-in.
allow_remote = false
bearer_token = ""
allow_unauthenticated_remote = false
# /state normally omits configured target hosts/ports.
expose_sensitive_state = false
max_connections = 128
# Absolute request deadline and bounded response write deadline.
request_timeout_seconds = 2.0
write_timeout_seconds = 2.0

[logging]
level = "INFO"
# Logs bounded peer/target/reason connection events; disabled to avoid routine log volume.
access_log = false
